<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>negative navigator</title>
  <script>
    function navigate() {
      dest = urlInput.value
      if (dest.length == 0) { return }
      if (!dest.startsWith("http")) { dest = "http://" + dest }
      api.loadURL(dest)
    }
    api.onUrlChange((url) => {
      urlInput.value = url
      document.title = url + " - negative navigator"
    })
  </script>
  <style>
    button {
      margin: 0;
      padding: 0
    }

    input {
      margin: 0
    }
  </style>
</head>

<body>
  <button onclick="api.goBack()">&lt;-</button>
  <button onclick="api.goForward()">-></button>
  <button onclick="api.goHome()">Home</button>
  <button onclick="api.reload()">⟳</button>
  <input id="url" style="width:80%">
  <button onclick="navigate()">Go!</button>
  <button onclick="api.openSettings(true)">⚙</button>
</body>
<script>
  //this script must be at the end because it works with DOM (thus needs to have it already)
  const urlInput = document.getElementById("url")
  urlInput.addEventListener("keypress", function (event) {
    if (event.key === "Enter") {
      event.preventDefault()
      navigate()
    }
  });
</script>

</html>
